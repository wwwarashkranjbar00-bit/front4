<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./index.css">
<style>
</style>
</head>
<body>

    <div class="logo-site">
        <img src="./image/Group 47602.svg" alt="">
        <h1>Your Logo</h1>
    </div>

    <div class="image">
        <img src="./image/Group 4.png" alt="">
    </div>
        <form action="">
            <div class="text">
                <h1>Sign up</h1>
                <p>Let’s get you all st up so you can access your personal account.</p>
            </div>
            <div class="inputs">
                <div class="inps">
                    <div class="dlinp">
                        <div class="inp">
                            <span>Last name</span>
                            <input type="text" name="" id="">
                        </div>
                        <div class="inp">
                            <span>Name</span>
                            <input type="text" name="" id="">
                        </div>
                    </div>
                    <div class="dlinp">
                        <div class="inp">
                            <span class="span2">Phone number</span>
                            <input type="text" name="" id="">
                        </div>
                        <div class="inp">
                            <span>Email</span>
                            <input type="text" name="" id="">
                        </div>
                    </div>
                    <div class="inp">
                            <span class="span3">Password</span>
                            <input type="text" name="" id="">  
                            <img src="./image/eye-off.svg" alt="">                      
                    </div>
                    <div class="inp">
                            <span class="span1">Confirm Password</span>
                            <input type="text" name="" id="">
                            <img src="./image/eye-off.svg" alt="">
                    </div>
                    <div class="inp-check">
                        <input type="checkbox">
                        <p>I agree to all the <span>Terms</span> and <span>Privacy Policies</span></p>
                    </div>
                </div>
                <div class="btns">
                    <button type="submit">Create account</button>
                    <p>Already have an account? <span>Login</span></p>
                </div>
                <div class="line"><span>Or Sign up with</span></div>
            </div>
        </form>
</body>
</html>
